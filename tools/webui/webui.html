<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Tofita Web UI</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style type="text/css">
        :root {
            --bg-color: #1e1e1e;
            --panel-bg: #252526;
            --panel-bg-alt: #2d2d2d;
            --text-color: #d4d4d4;
            --primary-color: #007acc;
            --primary-hover: #005a9e;
            --border-color: #3c3c3c;
            --highlight-bg: #3e3e42;
            --selected-bg: #684500; /* Dark Orange */
            --number-color: #6369fc; /* Light Green */
            --string-color: #ce9178; /* Yellowish-Orange */
            --operator-color: #d4d4d4; /* Default text color */
        }

        /* Basic reset and font setup */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            height: 100vh;
            padding: 1rem;
            gap: 1rem;
        }

        /* --- Controls Area --- */
        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            align-items: center;
        }

        /* 2. Brand Icon */
        .brand-icon {
            height: 38px;
            width: 38px;
            flex-shrink: 0;
        }

        /* --- Input Wrapper for Clear Button --- */
        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
            flex-grow: 1;
        }

        /* 1. Clear button for filter */
        .clear-input {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--text-color);
            cursor: pointer;
            font-size: 1.2rem;
            padding: 0 5px;
            display: none; /* Hidden by default */
        }

        .input-wrapper input:not(:placeholder-shown) + .clear-input {
            display: block; /* Show when there is text */
        }

        /* --- Button Styling --- */
        button {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            transition: background-color 0.3s ease;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            flex-shrink: 0;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        button.active {
            background-color: #3a3d41;
        }

        #clearLogButton {
            background-color: #6c757d;
        }
        #clearLogButton:hover {
            background-color: #5a6268;
        }

        /* --- Filter & Highlight Input Styling --- */
        .text-input {
            width: 100%;
            background-color: var(--panel-bg-alt);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            padding: 0.75rem;
            border-radius: 8px;
            font-size: 1rem;
        }

        #filterInput {
             padding-right: 35px; /* Space for the 'X' button */
        }

        .text-input:focus {
            outline: none;
            border-color: var(--primary-color);
        }

        /* --- Log Container Styling --- */
        #logContainer {
            flex-grow: 1;
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            overflow-y: auto;
            padding: 0.5rem;
            font-family: Consolas, 'Courier New', monospace;
            font-size: 0.9rem;
            white-space: pre-wrap;
            word-break: break-all;
        }

        .log-line {
            padding: 0.1rem 0.5rem;
            border-radius: 4px;
            transition: background-color 0.2s ease;
            cursor: pointer;
        }

        .log-line:nth-child(even) {
            background-color: var(--panel-bg-alt);
        }

        .log-line:hover {
            background-color: var(--highlight-bg);
        }

        /* 4. Style for selected lines */
        .log-line.selected {
            background-color: var(--selected-bg) !important;
        }

        /* 7. Syntax Highlighting Styles */
        .number { color: var(--number-color); }
        .string { color: var(--string-color); }
        .op-gt { color: var(--operator-color); font-weight: bold; }

        /* 5. Highlight search term style */
        mark {
            background-color: #f5da00;
            color: black;
            border-radius: 3px;
            padding: 1px 2px;
        }

        /* Dark scrollbar for Chrome/WebKit browsers */
        #logContainer::-webkit-scrollbar { width: 12px; }
        #logContainer::-webkit-scrollbar-track { background: var(--panel-bg-alt); border-radius: 8px; }
        #logContainer::-webkit-scrollbar-thumb { background-color: #555; border-radius: 10px; border: 3px solid var(--panel-bg-alt); }
        #logContainer::-webkit-scrollbar-thumb:hover { background-color: #777; }
    </style>
</head>
<body>

    <div class="controls">
        <!-- 2. Brand Icon -->
        <img class="brand-icon" src="favicon.ico" />
        <button id="modeToggle">Use HTML Instead</button>
        <div class="input-wrapper">
            <input type="text" id="filterInput" class="text-input" placeholder="Filter logs..." disabled>
            <!-- 1. Clear filter button -->
            <button class="clear-input" id="clearFilterButton">&times;</button>
        </div>
        <!-- 5. Highlight field -->
        <div class="input-wrapper">
            <input type="text" id="highlightInput" class="text-input" placeholder="Highlight..." disabled>
            <button class="clear-input" id="clearHighlightButton">&times;</button>
        </div>
        <button id="clearLogButton" disabled>Clear Log</button>
    </div>

    <div id="logContainer">Check Chrome Developer Tools Console, or press "Use HTML Instead".</div>

    <script type="text/javascript">
    (function() {
        // --- DOM Element References ---
        const modeToggleButton = document.getElementById('modeToggle');
        const filterInput = document.getElementById('filterInput');
        const highlightInput = document.getElementById('highlightInput');
        const logContainer = document.getElementById('logContainer');
        const clearLogButton = document.getElementById('clearLogButton');
        const clearFilterButton = document.getElementById('clearFilterButton');
        const clearHighlightButton = document.getElementById('clearHighlightButton');

        // --- State Variables ---
        let useHTML = false;
        let busy = false;
        let logLinesCache = []; // Cache holds objects: { id: number, content: string }
        let nextLogId = 0;
        const selectedLineIds = new Set(); // 4. Store IDs of selected lines

        /**
         * 7. Enhanced syntax highlighting.
         * Takes a string and returns an HTML string with various syntax elements wrapped in spans.
         * @param {string} text - The raw log line text.
         * @returns {string} - HTML string with syntax highlighted.
         */
        function highlightSyntax(text) {
            const sanitizedText = text.replace(/</g, "&lt;").replace(/>/g, "&gt;");
            return sanitizedText
                .replace(/(['"])(.*?)\1/g, '<span class="string">$&</span>')
                .replace(/(~~mark~~)(.*?)\1/g, '<mark>$2</mark>')
                .replace(/&gt;/g, '<span class="op-gt">&gt;</span>') // Must run after sanitization
                .replace(/(0x[a-fA-F0-9]+|\b\d+(\.\d+)?\b)/g, '<span class="number">$&</span>')
        }

        /**
         * Renders the log lines to the HTML container based on current state.
         */
        function renderLog() {
            if (!useHTML) return;

            const filterText = filterInput.value.toLowerCase();
            const highlightText = highlightInput.value;

            // 6. Update placeholder with log count
            filterInput.placeholder = logLinesCache.length > 1? `Filter ${logLinesCache.length} logs...` : `Filter logs...`;

            const fragment = document.createDocumentFragment();

            let linesToRender = logLinesCache;

            if (filterText.length >= 2) {
                linesToRender = logLinesCache.filter(line => line.content.toLowerCase().includes(filterText));
            }

            linesToRender.forEach(lineObj => {
                const lineDiv = document.createElement('div');
                lineDiv.className = 'log-line';
                lineDiv.dataset.id = lineObj.id;

                if (selectedLineIds.has(lineObj.id)) {
                    lineDiv.classList.add('selected');
                }

                let line = lineObj.content + '';

                // Apply highlight marking if text is present. This now works on the filtered list.
                if (highlightText.length > 0) {
                    const highlightRegex = new RegExp(highlightText.replace(/[-\/\\^$*+?.()|[\]{}]/g, '\\$&'), 'gi');
                    // We must be careful not to highlight inside HTML tags from syntax highlighting.
                    // A simple replace is generally safe here because user input is escaped in the regex,
                    // but a more robust solution would parse the DOM. For this tool, it's a good trade-off.
                    line = line.replace(highlightRegex, match => `~~mark~~${match}~~mark~~`);
                }

                let lineHTML = highlightSyntax(line);

                lineDiv.innerHTML = lineHTML;
                fragment.appendChild(lineDiv);
            });

            const scrollAtBottom = logContainer.scrollHeight - logContainer.clientHeight <= logContainer.scrollTop + 1;

            logContainer.innerHTML = '';
            logContainer.appendChild(fragment);

            if (scrollAtBottom) {
                logContainer.scrollTop = logContainer.scrollHeight;
            }
        }

        // --- Event Listeners ---
        modeToggleButton.addEventListener('click', () => {
            useHTML = !useHTML;
            modeToggleButton.textContent = useHTML ? 'Use Console Instead' : 'Use HTML Instead';
            modeToggleButton.classList.toggle('active', useHTML);
            [filterInput, highlightInput, clearLogButton].forEach(el => el.disabled = !useHTML);

            if (useHTML) {
                logContainer.innerHTML = '';
                renderLog();
            } else {
                logContainer.innerHTML = 'Logs are now being sent to the Developer Tools Console.';
                filterInput.placeholder = 'Filter logs...';
            }
        });

        // Combined handler for both inputs
        const handleInputChange = () => {
            if (filterInput.value.length === 1 && highlightInput.value.length === 0) {
                // Do nothing to avoid filtering on a single character
                return;
            }
            renderLog();
        };
        filterInput.addEventListener('input', handleInputChange);
        highlightInput.addEventListener('input', handleInputChange);

        // Clear buttons for inputs
        clearFilterButton.addEventListener('click', () => {
            filterInput.value = '';
            renderLog();
        });
        clearHighlightButton.addEventListener('click', () => {
            highlightInput.value = '';
            renderLog();
        });

        clearLogButton.addEventListener('click', () => {
            if (useHTML) {
                logLinesCache = [];
                selectedLineIds.clear();
                nextLogId = 0;
                renderLog();
            }
        });

        logContainer.addEventListener('click', (e) => {
            const lineDiv = e.target.closest('.log-line');
            if (lineDiv) {
                const lineId = parseInt(lineDiv.dataset.id, 10);
                if (selectedLineIds.has(lineId)) {
                    selectedLineIds.delete(lineId);
                    lineDiv.classList.remove('selected');
                } else {
                    selectedLineIds.add(lineId);
                    lineDiv.classList.add('selected');
                }
            }
        });

        // --- Main Data Fetching Logic ---
        console.log('[Welcome to the Tofita Web UI!]');
        setInterval(function() {
            if (busy) return;
            busy = true;

            fetch('/buffer.json')
                .then(response => response.ok ? response.json() : Promise.reject(`HTTP error! status: ${response.status}`))
                .then(data => {
                    const lines = data ? ('' + data).split('\n').filter(line => line) : [];
                    if (lines.length > 0) {
                        lines.forEach(line => {
                            logLinesCache.push({ id: nextLogId++, content: line });
                        });

                        if (useHTML) {
                            renderLog();
                        } else {
                            lines.forEach(line => console.log(line));
                        }
                    }
                    busy = false;
                })
                .catch(error => {
                    busy = false;
                });
        }, 222);

    })();
    </script>
</body>
</html>
